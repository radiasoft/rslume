# Phoebus settings for the AWA zone1->zone2 twin demo.
#
# ui_monitor_period=500 (Phoebus' own default) makes its ResponsivenessMonitor
# dump every thread's stack trace at SEVERE whenever the JavaFX UI thread
# doesn't answer a ping within 500 ms -- a built-in watchdog
# (core/ui/.../ResponsivenessMonitor.java in the Phoebus source), not an
# error. It fires often in this environment because there is no GLX
# acceleration for the remote display, so JavaFX's software-rendered
# startup routinely takes longer than 500 ms per frame. Phoebus' own
# preferences file documents 0 as "disable":
#
#   org.phoebus.ui/ui_monitor_period=0
#
# Pass this file at launch:
#
#   java -jar product-<version>.jar -settings /path/to/this/settings.ini \
#       -resource /path/to/zone_twin.bob

org.phoebus.ui/ui_monitor_period=0
